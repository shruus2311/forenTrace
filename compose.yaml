services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: forentrace
      POSTGRES_USER: forentrace
      POSTGRES_PASSWORD: ${FORENTRACE_POSTGRES_PASSWORD:?Set FORENTRACE_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - forentrace_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forentrace -d forentrace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forentrace_postgres:
