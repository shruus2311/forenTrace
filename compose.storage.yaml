services:
  minio:
    build: ./backend/storage
    environment:
      MINIO_ROOT_USER: ${FORENTRACE_MINIO_ROOT_USER:?Set FORENTRACE_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${FORENTRACE_MINIO_ROOT_PASSWORD:?Set FORENTRACE_MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    command: ["server", "/data"]
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - forentrace_minio:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forentrace_minio:
